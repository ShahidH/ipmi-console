# Typecheck, lint, unit/component tests with coverage, the e2e suite against the
# simulated BMC, and the same suite against the packaged app, on Linux, Windows
# (the primary target) and macOS. Also called by release.yml before building.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # npm ci runs the prepare script; git hooks aren't needed here.
  HUSKY: '0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron 42+ no longer downloads its binary in postinstall.
      - run: npx install-electron --no
      - name: Allow Electron's sandbox on Ubuntu (AppArmor restricts unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: e2e (development build)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npm run test:e2e
      - name: Third-party notices are up to date (regenerated by the build)
        if: runner.os == 'Linux'
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: e2e (packaged app)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npm run test:package
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}
          path: |
            coverage/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
