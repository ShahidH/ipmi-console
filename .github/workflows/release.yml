# release-please keeps a release PR open with the next version and changelog,
# built from Conventional Commits on main. Merging it creates a draft release and
# its tag; the full CI suite then runs, the installers are built and attached, and
# the release is published. Code signing turns on when the signing secrets exist
# (electron-builder reads CSC_LINK / CSC_KEY_PASSWORD).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Optional: with a personal token, CI also runs on the release PR (pull
          # requests opened with the default token don't trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  ci:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [release-please, ci]
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
          # Separate Intel (mac-x64) and Apple silicon (mac-arm64) apps, ad-hoc signed but not
          # notarised: users allow them once in System Settings → Privacy & Security.
          - os: macos-latest
            target: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${{ needs.release-please.outputs.tag }}"
      - run: npm ci
      - run: npx install-electron --no
      # npm installs the keychain module's binary for this Mac's CPU only; the other app needs the other one.
      - name: Keychain binaries for both Mac CPUs
        if: runner.os == 'macOS'
        run: node scripts/add-native-binaries.mjs darwin-x64 darwin-arm64
      - run: npm run build
      - name: Build installers
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # The Windows certificate only; on macOS it would be taken for an Apple identity.
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_SIGNING_CERT || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_SIGNING_CERT_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            !release/*__uninstaller.exe
            release/*.AppImage
            release/*-mac-*.dmg
            release/*-mac-*.zip
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Attach installers and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "IPMI Console $TAG" --draft=false
